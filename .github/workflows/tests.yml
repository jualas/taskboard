# Tests unitarios del backend (sin Postgres ni proveedores de IA reales).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar dependencias
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: .venv/bin/python -m pytest -q tests

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/<rama base> para comparar avisos en PRs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      - name: flutter analyze (cualquier aviso bloquea, también los info)
        run: flutter analyze
      - name: Sin avisos nuevos respecto a la base del PR
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/flutter-check.sh --no-test --base "origin/$BASE_REF"
      - name: flutter test
        run: flutter test --coverage
      - name: Cobertura por capa
        if: always()
        working-directory: .
        run: |
          {
            echo "### Cobertura del frontend por capa"
            python3 scripts/coverage_by_layer.py frontend/coverage/lcov.info || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
